name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: photomatch-api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/photomatch-api:${{ github.sha }}
      - name: Configure cluster
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
      - name: Apply config and migrate
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/photomatch-api:${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          kubectl apply -f photomatch-api/deploy/kubernetes/config.yaml
          envsubst < photomatch-api/deploy/kubernetes/migration-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete --timeout=300s job/photomatch-migrate-${RUN_ID}
      - name: Roll out API and worker
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/photomatch-api:${{ github.sha }}
        run: |
          envsubst < photomatch-api/deploy/kubernetes/backend.yaml | kubectl apply -f -
          kubectl rollout status deployment/photomatch-api --timeout=300s
          kubectl rollout status deployment/photomatch-worker --timeout=300s
