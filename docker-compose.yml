services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: photomatch
      POSTGRES_USER: photomatch
      POSTGRES_PASSWORD: photomatch
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photomatch -d photomatch"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.15
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: photomatch
      MINIO_ROOT_PASSWORD: photomatch-local-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-03-30T15-29-52Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 photomatch photomatch-local-secret;
      do sleep 1; done;
      mc mb --ignore-existing local/photomatch-local"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://photomatch:photomatch@postgres:5432/photomatch?schema=public
      REDIS_URL: redis://redis:6379
      R2_ENDPOINT: http://minio:9000
    command: npm run start
    ports:
      - "53000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://photomatch:photomatch@postgres:5432/photomatch?schema=public
      REDIS_URL: redis://redis:6379
      R2_ENDPOINT: http://minio:9000
    command: npm run start:worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
